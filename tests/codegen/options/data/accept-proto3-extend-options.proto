// U-16: protoc 30.1 allows a proto3 `extend` whose extendee is one of the nine
// google.protobuf.*Options messages (`AllowedExtendeeInProto3`,
// descriptor.cc:1105-1131); every other extendee stays refused. The frontend
// parses and discards the body and reports the recorded E6 warning, exactly as
// the proto2 path does. The leading-dot spelling is the same full name.
syntax = "proto3";

import "google/protobuf/descriptor.proto";

message Payload {
  int32 value = 1;
}

extend google.protobuf.FileOptions {
  optional string file_note = 50000;
}
extend google.protobuf.MessageOptions {
  optional string message_note = 50001;
}
extend google.protobuf.FieldOptions {
  optional string field_note = 50002;
}
extend google.protobuf.EnumOptions {
  optional string enum_note = 50003;
}
extend google.protobuf.EnumValueOptions {
  optional string enum_value_note = 50004;
}
extend google.protobuf.ServiceOptions {
  optional string service_note = 50005;
}
extend google.protobuf.MethodOptions {
  optional string method_note = 50006;
}
extend google.protobuf.OneofOptions {
  optional string oneof_note = 50007;
}
extend google.protobuf.ExtensionRangeOptions {
  optional string range_note = 50008;
}
extend .google.protobuf.MessageOptions {
  optional string leading_dot_note = 50009;
}
