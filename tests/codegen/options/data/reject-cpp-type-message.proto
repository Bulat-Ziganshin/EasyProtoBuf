syntax = "proto3";

package options.demo;

// U-54 / R09: a message-scope statement sets the field-only C++ type option.
// protoc 30.1: `Option field "(easypb.cpp)" is not a field or extension of
// message "MessageOptions".`
message Scoped {
  option (easypb.cpp).type = "MessageBox";

  int32 value = 1;
}
