syntax = "proto3";

package options.demo;

// V-29: `(easypb.cppfoo)` is a longer name in EasyProtoBuf's own namespace,
// not a member of the `(easypb.cpp)` family. It is an unknown option, not a
// misplaced field option. protoc 30.1: `Option "(easypb.cppfoo)" unknown.`
option (easypb.cppfoo) = true;

message Scalar {
  int32 value = 1;
}
