// CR-25 (accepted on the source door, E6): an `extend` declaration for a type
// that does not exist. The parser consumes the declaration, warns that it is
// not stored, and exits 0; protoc 30.1 refuses it. The descriptor door now
// validates extension members (`V-09`), but the source parser still discards
// the body, so this half remains the accepted E6 divergence. The test
// `codegen.parity.extensions_validated` pins it.
syntax = "proto2";
package parity;

extend NoSuchMessage {
  optional int32 e = 1;
}
