// CR-06, message shape 2: a declared field uses a reserved name. The source
// path refuses it while parsing; the descriptor half is res-field-name.pbs,
// encoded from res-field-name.txtpb. protoc 30.1 refuses the same shape
// ("Field name \"a\" is reserved.").
syntax = "proto2";
package parity;

message M {
  reserved "a";
  optional int32 a = 1;
}
