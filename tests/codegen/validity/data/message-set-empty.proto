// R05 (U-10/U-12), accepted control: a proto2 MessageSet that declares no
// ordinary fields. protoc 30.1 accepts it, and the option has no effect on the
// generated header, so the source and descriptor paths emit identical bytes.
// The source door now carries the option in the model (U-10) and the shared
// sweep accepts this shape on both doors; the `message-set-fields` and
// `message-set-proto3` parity fixtures cover the refused spellings.
syntax = "proto2";

message EmptyMessageSet
{
    option message_set_wire_format = true;
}
