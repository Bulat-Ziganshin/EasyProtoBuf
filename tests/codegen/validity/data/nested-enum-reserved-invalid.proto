syntax = "proto2";

// U-14: the source twin of nested-enum-reserved-invalid.txtpb. protoc refuses
// the text ("Reserved range end number must be greater than start number"),
// so the descriptor half is crafted from the .txtpb beside this file.
package nestedenum;

message Outer
{
    enum Nested
    {
        ZERO = 0;
        reserved 5 to 3;
    }
}
