syntax = "proto2";

// R1 / CR-01, CR-17: the numeric default spelling family. Every field here is
// written with a spelling the emitter must not paste: an integer token on a
// float field (protoc reads it with the octal/hex parser), and an integral
// default whose source spelling is not the decimal value protoc stores. The
// descriptor twin is protoc's own encoding of this file, and the validity
// driver requires the two generated headers to be byte-identical.
//
// The integral values include both 64-bit extremes (CR-05): the emitter owns
// the typed C++ literal, while both frontends store the canonical decimal
// text asserted here.
message DefaultSpellings
{
    optional float f_octal = 1 [default = 010];
    optional double d_octal = 2 [default = 010];
    optional float f_hex = 3 [default = 0x10];
    optional double d_hex = 4 [default = 0x10];
    optional float f_neg_octal = 5 [default = -010];
    optional int32 i32_octal = 6 [default = 010];
    optional int32 i32_hex = 7 [default = 0x10];
    optional int32 i32_neg_zero = 8 [default = -0];
    optional int64 i64_octal = 9 [default = 077];
    optional int64 i64_min = 10 [default = -9223372036854775808];
    optional int64 i64_max = 11 [default = 9223372036854775807];
    optional uint64 u64_max = 12 [default = 18446744073709551615];
    optional uint64 u64_hex_max = 13 [default = 0xFFFFFFFFFFFFFFFF];
    optional uint64 u64_octal = 14 [default = 077];
}
