// shadowing - Appendix C B6/B10's nearer head: `pkg.sub` is a message that
// stands closer to the requester than the `sub` package, but the requester does
// not import this file, so the head is INVISIBLE and must not shadow. The
// fixture is loaded as a SECOND root (Step 8.2's "a second root grants
// nothing"), which is the only way to put it in the index without importing it.
syntax = "proto2";
package pkg;
message sub { optional int32 nope = 1; }
